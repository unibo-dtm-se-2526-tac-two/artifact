[tool.poetry]
name = "tac_two"
packages = [
    { include = "tac_two" },
]
version = "1.0.0"
description = "A two-level tic-tac-toe game"
authors = ["Begoyim Kosimova <begoyim.kosimova@studio.unibo.it>",
           "Sofia Scardovi <sofia.scardovi@studio.unibo.it>",
           "Martina Samorè <martina.samore@studio.unibo.it>",]
license = "Apache 2.0"
readme = "README.md"

[tool.poetry.dependencies]
# update the Python versions in .github/workflows/check.yml if you change this
python = ">= 3.10.0 < 4.0.0"
fastapi = "^0.152.0"
fastapi-users = {extras = ["sqlalchemy"], version = "^15.0.5"}
sqlalchemy = {version = ">=2.0,<2.1", extras = ["asyncio"]}
asyncpg = "^0.32.0"
alembic = "^1.20.0"
uvicorn = "^0.54.0"
pydantic-settings = ">=2.0,<2.16"

[tool.poetry.group.dev.dependencies]
coverage = "^7.4.0"
mypy = "^1.10.1"
poethepoet = "^0.37.0"
poetry = "^1.8.3"
pytest = "^8.3.5"
ruff = "^0.15.0"
httpx = "^0.28.1"
pytest-asyncio = "^1.4.0"
aiosqlite = "^0.22.1"

[tool.poe.tasks]
test = "pytest"
coverage = "coverage run -m pytest"
coverage-report = "coverage report -m"
coverage-html = "coverage html"
ruff-check = "ruff check"
ruff-fix = "ruff check --fix"
format = "ruff format"
format-check = "ruff format --check"
mypy = "mypy tac_two tests"
compile = "python -m compileall tac_two tests"
static-checks = [
    "ruff-check",
    "mypy",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
plugins = ["pydantic.mypy"]